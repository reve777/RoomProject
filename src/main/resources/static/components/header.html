<header class="navbar">
    <div class="nav-container">
        <div class="logo" style="cursor: pointer;" onclick="app.switchView('roomsView')">
            <span class="icon">🏨</span>
            <span class="brand-name">Grand Luxury Resort &amp; Hotel</span>
        </div>
        <div class="header-right">
            <div id="authGuestSection" class="auth-buttons">
                <button class="btn btn-guest" onclick="app.handleGuestLogin()">👤 訪客登入</button>
                <button class="btn btn-outline" onclick="app.showModal('loginModal')">會員登入</button>
                <button class="btn btn-primary" onclick="app.switchView('registerView')">📝 免費註冊</button>
            </div>
            <div id="authUserSection" class="user-menu d-none">
                <span id="userGreeting" class="user-badge">歡迎, 訪客</span>
                <button class="btn btn-sm btn-outline" onclick="app.switchView('profileView')">個人中心</button>
                <button class="btn btn-sm btn-danger" onclick="app.logout()">登出</button>
            </div>
        </div>
    </div>
</header>
