<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尊榮會員註冊 | Grand Luxury Hotel & Resort</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .register-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            max-width: 520px;
            width: 100%;
            padding: 36px;
        }
        .logo-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-header h1 {
            font-size: 1.6rem;
            color: #0f172a;
            margin: 8px 0 4px 0;
            font-weight: 700;
        }
        .logo-header p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 0;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .password-status {
            font-size: 0.8rem;
            margin-top: 4px;
            display: block;
        }
        .oauth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0 16px 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .oauth-divider::before, .oauth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .oauth-divider::before { margin-right: 12px; }
        .oauth-divider::after { margin-left: 12px; }
        .btn-guest {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-guest:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo-header">
            <div style="font-size: 2.2rem; color: #b45309;">✨ 🏨 ✨</div>
            <h1>加入 Grand Luxury 尊榮會員</h1>
            <p>即刻註冊，開啟全球奢華住宿與米其林美饌專屬禮遇</p>
        </div>

        <form id="standaloneRegisterForm" onsubmit="handleStandaloneRegister(event)">
            <div class="form-group">
                <label>使用者帳號 *</label>
                <input type="text" id="regUsername" class="form-control" placeholder="請輸入 3~20 字元英數字" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>電子信箱 *</label>
                <input type="email" id="regEmail" class="form-control" placeholder="service@luxuryhotel.com" required autocomplete="email">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>密碼 *</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="至少 6 位數" required oninput="checkStandalonePwdMatch()" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>確認密碼 *</label>
                    <input type="password" id="regPasswordConfirm" class="form-control" placeholder="再次輸入密碼" required oninput="checkStandalonePwdMatch()" autocomplete="new-password">
                    <span id="pwdMatchStatus" class="password-status"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>真實姓名</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="王小明">
                </div>
                <div class="form-group">
                    <label>聯絡電話</label>
                    <input type="text" id="regPhone" class="form-control" placeholder="0912-345-678">
                </div>
            </div>

            <div class="form-group" style="margin: 16px 0;">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 0.9rem; cursor: pointer;">
                    <input type="checkbox" id="regAgreeTerms" required checked>
                    我同意飯店服務條款與隱私權規範
                </label>
            </div>

            <button type="submit" id="btnSubmitStandaloneReg" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem;">
                ✨ 確認註冊並登入
            </button>
        </form>

        <div class="oauth-divider">其他快速管道</div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <a href="/index.html" class="btn btn-outline" style="flex: 1; text-decoration: none; text-align: center;">
                🏠 回首頁 / 會員登入
            </a>
            <button type="button" class="btn btn-guest" style="flex: 1;" onclick="handleQuickGuest()">
                👤 訪客體驗免註冊
            </button>
        </div>
    </div>

    <script>
        let isRegistering = false;

        function checkStandalonePwdMatch() {
            const p1 = document.getElementById('regPassword').value;
            const p2 = document.getElementById('regPasswordConfirm').value;
            const status = document.getElementById('pwdMatchStatus');
            if (!p2) {
                status.innerText = '';
                return;
            }
            if (p1 === p2) {
                status.innerText = '✅ 密碼一致';
                status.style.color = '#10b981';
            } else {
                status.innerText = '❌ 兩次密碼輸入不一致';
                status.style.color = '#ef4444';
            }
        }

        async function handleStandaloneRegister(e) {
            e.preventDefault();
            if (isRegistering) return;

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const fullName = document.getElementById('regFullName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (password !== passwordConfirm) {
                alert('兩次密碼輸入不一致，請重新檢查！');
                return;
            }

            const btn = document.getElementById('btnSubmitStandaloneReg');
            isRegistering = true;
            if (btn) {
                btn.disabled = true;
                btn.innerText = '註冊處理中並寄發迎賓信...';
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, fullName, phone })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || '註冊失敗');
                }

                // Save auth to localStorage
                localStorage.setItem('token', data.data.accessToken);
                localStorage.setItem('user', JSON.stringify({
                    id: data.data.userId,
                    username: data.data.username,
                    email: data.data.email,
                    fullName: fullName || username,
                    roles: data.data.roles
                }));

                alert('🎉 註冊成功！系統已發送歡迎信件至 ' + email + '，正在導向首頁...');
                window.location.href = '/index.html';
            } catch (err) {
                alert('註冊失敗: ' + err.message);
            } finally {
                isRegistering = false;
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = '✨ 確認註冊並登入';
                }
            }
        }

        async function handleQuickGuest() {
            try {
                const response = await fetch('/api/auth/guest-login', { method: 'POST' });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || '訪客登入失敗');

                localStorage.setItem('token', data.data.accessToken);
                localStorage.setItem('user', JSON.stringify({
                    id: data.data.userId,
                    username: data.data.username,
                    email: data.data.email,
                    fullName: data.data.fullName || data.data.username,
                    roles: data.data.roles
                }));
                alert('訪客體驗登入成功！正在導向首頁...');
                window.location.href = '/index.html';
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
